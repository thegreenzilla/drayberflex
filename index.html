async function tick(){if(!SC.stream)return;const v=document.getElementById("sc-vid");
  if(v&&v.readyState>=2&&!SC.busy){SC.busy=true;let txt="";
    try{if(SC.det){const r=await SC.det.detect(v);txt=r[0]?r[0].rawValue:""}else if(window.jsQR){const cv=SC.cv||(SC.cv=document.createElement("canvas")),w=v.videoWidth,hh=v.videoHeight;cv.width=w;cv.height=hh;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(v,0,0,w,hh);const r=jsQR(cx.getImageData(0,0,w,hh).data,w,hh);txt=r?r.data:""}}catch(e){}
    SC.busy=false;if(txt&&txt!==SC.last){SC.last=txt;lookupCode(txt)}}
  SC.t=setTimeout(tick,220)}
function lookupCode(raw){const code=String(raw||"").trim().toUpperCase().replace(/^(MOBER|DF):/,"").replace(/\s/g,""),norm=x=>String(x||"").toUpperCase().replace(/-/g,"");
  if(!code)return toast("Type the code under the QR.");
  const a=Object.values(S.applicants).find(x=>x.id===raw||norm(x.code)===norm(code)||norm(x.code)==="MB"+norm(code));
  if(!a)return toast("No application found for "+code);
  UI.scanId=a.id;if(navigator.vibrate)navigator.vibrate(80);
  const ok=(a.booking?.status||"approved")==="approved"&&!a.checkin?.status&&localDay(a.slot)===today()&&can("verifier");
  if(ok){const now=new Date().toISOString();a.checkin={status:"show",at:now,by:S.uid,via:"qr"};(a.log=a.log||[]).push({t:now,by:S.uid,msg:"Checked in by QR scan"});a.updatedAt=now;setDoc("applicants/"+a.id,a);UI.scanJust=a.id;if(UI.mci){UI.mci={screen:"scan",flash:a.id};clearTimeout(UI._flt);UI._flt=setTimeout(()=>{if(UI.mci&&UI.mci.flash===a.id){UI.mci.flash=null;render()}},8000)}render();setTimeout(()=>{SC.last=""},2500);if(!UI.mci)toast("Checked in: "+a.name);return}
  UI.scanJust=null;if(UI.mci){if(a.checkin?.status==="show"&&localDay(a.slot)===today()){UI.mci={screen:"scan",flash:null};render();setTimeout(()=>{SC.last=""},2500);return toast(a.name+" is already checked in")}scStop();UI.mci={screen:"docs",id:a.id,k:null}}render();toast("Found "+a.name)}

function scanPanel(){const a=UI.scanId&&S.applicants[UI.scanId];
  return `<div class="sc-grid"><div class="stack">
    <div class="sc-cam">${UI.camOn?"":`<button class="sc-start" data-act="sc-start"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg><b>Start scanning</b><small>Turns on the camera</small></button>`}<video id="sc-vid" playsinline muted></video>${UI.camOn?`<div class="sc-frame"></div><div class="sc-msg">Hold the applicant's QR code inside the square</div>`:""}</div>
    <div class="row" style="justify-content:space-between">${UI.camOn?`<button class="btn sm" data-act="sc-stop">Stop camera</button>`:"<span></span>"}<span class="small muted">Applicants with an approved interview today are checked in automatically.</span></div>
    <form class="row" data-scform style="align-items:flex-end;flex-wrap:nowrap"><label class="f" style="flex:1;min-width:0">No QR? Type the booking code<input id="sc-code" placeholder="MB-XXXXXX" autocomplete="off" autocapitalize="characters"></label><button class="btn" type="submit">Find</button></form>
  </div><div>${a?scanCard(a):`<div class="panel sc-empty"><b>Waiting for a scan</b><p class="small muted" style="margin:6px 0 0">The applicant's details appear here.</p></div>`}</div></div>`}
function vScan(){return vCheckin()}

function scanCard(a){const s=settings(),day=localDay(a.slot),t=today();
  const when=day===t?tag("Today","go"):day<t?tag("Earlier date","stop"):tag("Later date","wait");
  const row=(k,v)=>`<div><dt>${k}</dt><dd>${v||"—"}</dd></div>`,pend=a.booking?.status==="pending",dec=a.booking?.status==="declined";
  return `<div class="panel stack"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="small muted">${esc(a.code||"No booking code")}</div><h2 style="margin:2px 0 0">${esc(a.name)}${ageTxt(a)}</h2></div>${stageTag(a)}</div>
   ${a.checkin?.status==="show"?`<div class="sc-ok"><b>${UI.scanJust===a.id?"Checked in":"Already checked in"}</b><span>${fmtDT(a.checkin.at)}</span></div>`:pend?`<div class="sc-warn">This interview hasn't been approved yet.</div>`:dec?`<div class="sc-warn bad">This interview was declined.</div>`:day!==t?`<div class="sc-warn">Interview is booked for ${fmtD(a.slot)}, not today.</div>`:""}
   <dl class="sc-dl">${row("Interview",fmtDT(a.slot)+" "+when)}${row("Position",esc(a.position||s.position))}${row("Campaign",esc(a.campaign))}${row("Mobile",esc(a.phone))}${row("Email",esc(a.email))}
    ${appFacts(a)}${row("Referral code",esc(a.refCode))}${row("Applied",fmtDT(a.createdAt))}</dl>
   <div class="row">${pend?`<button class="btn primary lg" data-rq="approve" data-id="${a.id}">Approve interview</button>`:!a.checkin?.status&&can("verifier")&&!dec?`<button class="btn primary lg" data-act="sc-ci" data-id="${a.id}">Check in anyway</button>`:a.checkin?.status==="show"?`<button class="btn primary lg" data-open="${a.id}" data-sec="docs">Verify documents →</button>`:""}<button class="btn lg" data-act="sc-next">Scan next applicant</button></div></div>`}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const A=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(!/^(cp|ap|sc)-/.test(A))return;e.preventDefault();
  switch(A){
   case"cp-new":UI.editCamp=newCamp();render();return window.scrollTo(0,0);
   case"cp-edit":UI.editCamp=clone(campById(id));render();return window.scrollTo(0,0);
   case"cp-cancel":UI.editCamp=null;return render();
   case"cp-copy":{const c=campById(id),u=campUrl(c);try{await navigator.clipboard.writeText(u);toast("Link copied")}catch(err){prompt("Copy this link",u)}return}
   case"cp-del":{const c=campById(id);if(!confirm(`Delete “${c.name}”? Applicants who already booked stay in the system.`))return;await saveCamps(camps().filter(x=>x.id!==id));UI.editCamp=null;render();return toast("Campaign deleted")}
   case"cp-save":{const c=readCampForm(),isNew=!c.id;
     if(!c.name)return toast("Give the campaign a name.");if(!c.position)return toast("Add the position.");if(!c.jd)return toast("Add the job description.");
     if(!c.days.length)return toast("Pick at least one interview day.");if(c.end<=c.start)return toast("The last slot must end after the first one starts.");
     if(camps().some(x=>x.name.toLowerCase()===c.name.toLowerCase()&&x.id!==c.id))return toast("Another campaign has that name.");
     const L=camps().slice();
     if(isNew){c.id=(c.name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32)||"campaign")+"-"+uid().slice(0,4);c.createdAt=new Date().toISOString();c.by=S.uid;L.push(c)}
     else{L[L.findIndex(x=>x.id===c.id)]=c;let ch=false;Object.values(S.applicants).forEach(a=>{if(a.campaignId===c.id&&a.campaign!==c.name){a.campaign=c.name;ch=true}});if(ch)localSave()}
     if(!parseGeo(c.hubGeo)&&c.location){const g=await geocode(c.location);if(g){c.hubGeo=g.lat.toFixed(5)+", "+g.lng.toFixed(5);const k=L.findIndex(x=>x.id===c.id);L[k]=c}}
     await saveCamps(L);UI.editCamp=clone(c);render();return toast(isNew?"Campaign created. Copy the link to share it.":"Changes saved")}
   case"ap-go":return apGo(v,b);
   case"ap-month":{const base=new Date((PUB.month||today().slice(0,7))+"-01T00:00");base.setMonth(base.getMonth()+(+v));PUB.month=localDay(base).slice(0,7);return render()}
   case"ap-day":PUB.day=v;PUB.time=null;PUB.err="";return render();
   case"ap-time":PUB.time=v;return render();
   case"ap-book":b.disabled=true;return bookNow();
   case"ap-print":return window.print();
   case"sc-start":return startCam();
   case"sc-stop":scStop();return render();
   case"sc-ci":{const a=S.applicants[id],now=new Date().toISOString();a.checkin={status:"show",at:now,by:S.uid,via:"qr"};(a.log=a.log||[]).push({t:now,by:S.uid,msg:"Checked in by QR scan (not on booked date)"});await setDoc("applicants/"+id,a);UI.scanJust=id;render();return toast("Checked in: "+a.name)}
   case"sc-next":UI.scanJust=null;UI.scanId=null;SC.last="";render();{const f=document.getElementById("sc-code");if(f)f.focus()}return;
  }});
document.addEventListener("input",e=>{const t=e.target;if(!t.id&&!t.dataset.day)return;
  if(t.id&&t.id.startsWith("ap-")){PUB.form[t.id.slice(3)]=t.type==="checkbox"?t.checked:t.value}
  else if(UI.editCamp&&(t.id.startsWith("cp-")||t.dataset.day))UI.editCamp=readCampForm()});
document.addEventListener("change",e=>{const t=e.target;if(t.id&&t.id.startsWith("ap-"))PUB.form[t.id.slice(3)]=t.type==="checkbox"?t.checked:t.value;else if(UI.editCamp&&((t.id||"").startsWith("cp-")||t.dataset.day))UI.editCamp=readCampForm()});
document.addEventListener("submit",e=>{if(e.target.matches("[data-scform]")){e.preventDefault();lookupCode(document.getElementById("sc-code").value)}});


const STEPS_LP=[["01","Mag-apply online","Sagutan ang form at pumili ng schedule."],["02","Document check at orientation","Dalhin ang mga orihinal na dokumento sa hub."],["03","Interview at driving test","Simpleng interview at road test."],["04","1 araw na paid training","EV driving, delivery at customer service."],["05","Ma-accredit at mag-check in","Pumasa sa assessment, at handa ka nang kumita."]];
function vLanding(){const c=(settings().camps||[]).find(x=>x.active&&!(x.endDate&&today()>x.endDate)),href=`#apply/${c?c.id:"open"}`;
  const WHO=[["#8fd14f","Sa iyong day off","Rest Day Drivers","May regular na trabaho ka pero gusto mo pang kumita sa iyong day off? Mag-check in lang sa hub kapag available ka."],
    ["#f5c542","Habang naghihintay","OFW / Abroad-bound","Nag-aabang pa ng deployment? Huwag pabayaan ang panahon — kumita muna habang naghihintay."],
    ["#7aa7e0","Walang fixed commitment","Freelance / Transitioning","Naghahanap ng flexible work na walang fixed na commitment? Drayber Flex ang para sa iyo."]];
  const PAY=[["#8fd14f","₱900","Deployed Pay — Bawat Araw na May Trip","Bayad para sa araw na may delivery assignment."],
    ["#f5c542","₱300","Standby Allowance — Kahit Walang Trip","Kapag nag-check in ka sa hub at nandoon ka para sa deployment pero walang available na trip para sa iyo sa araw na iyon, pwede kang makatanggap ng ₱300 standby allowance — subject sa program rules at daily slot management. Hindi sayang ang iyong oras ng pagpunta."]];
  const PERKS=[["Flexible schedule","Piliin ang mga araw na available kang magtrabaho."],["Bayad ka agad","Within the day ang bayad kapag walang issue."],["1 araw na paid training","Matutunan ang EV driving, delivery process at customer service."]];
  const REQ=["21 taong gulang pataas","Bukas sa lalaki at babae","May valid driver's license","May hindi bababa sa 1 taong driving experience","May NBI clearance at medical certificate","May smartphone na may mobile data"];
  return `<div class="lp"><header class="lp-top"><span class="lp-logo">Drayber<span>Flex</span></span><div class="lp-act"><a class="lp-btn ghost" href="#status">Tingnan ang status</a><a class="lp-btn ghost" href="${href}">Mag-apply</a></div></header>
  <section class="lp-hero"><div class="lp-eye">EV Delivery Driver</div><h1 class="lp-h1">Ano ang Drayber Flex?</h1>
   <p class="lp-sub lp-wide">Ang Drayber Flex ay para sa mga driver na gustong kumita habang naka-rest day, naghihintay na ma-deploy sa abroad, o naghahanap lang ng part-time na trabaho.</p>
   <p class="lp-sub lp-wide" style="margin-top:14px">Piliin ang mga araw na available ka at pumunta sa hub ayon sa iyong confirmed schedule.</p>
   <a class="lp-btn lime lg" href="${href}">Mag-apply ngayon →</a><p class="lp-sub" style="margin-top:16px;font-size:15px">Nag-apply ka na? <a href="#status" style="color:#8fd14f">Tingnan ang application mo gamit ang code mo</a></p></section>
  <section class="lp-sec"><div class="lp-eye">Para kanino ito?</div>
   <div class="lp-who">${WHO.map(([ac,tag,t,d],i)=>`<div class="lp-card" style="--ac:${ac}"><div class="lp-cardtop"><span class="lp-n">0${i+1}</span><span class="lp-tag">${tag}</span></div><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>
  <section class="lp-sec"><div class="lp-eye">Kita at benepisyo</div>
   ${PAY.map(([ac,amt,t,d])=>`<div class="lp-pay" style="--ac:${ac}"><div><div class="lp-amt">${amt}</div><h3>${t}</h3></div><p>${d}</p></div>`).join("")}
   <div class="lp-perks">${PERKS.map(([t,d])=>`<div class="lp-perk"><b>${t}</b><p>${d}</p></div>`).join("")}</div></section>
  <section class="lp-sec"><div class="lp-eye">Sino ang puwedeng sumali?</div><ul class="lp-check">${REQ.map(x=>`<li>${x}</li>`).join("")}</ul></section>
  <section class="lp-sec"><div class="lp-eye">Para sa Drayber Flex applicants</div><h2 class="lp-h1">Paano Maging Accredited Drayber Flex?</h2><p class="lp-sub lp-wide">Kumpletuhin ang requirements at ang 1 araw na paid training. Kapag pumasa ka sa training at assessment, magiging accredited Drayber Flex driver ka.</p></section>
  <section class="lp-steps">${STEPS_LP.map(([n,t,d],i)=>`<div class="lp-step${i===4?" last":""}"><div class="lp-n">${n}</div><h3>${t}</h3><p>${d}</p></div>`).join("")}</section>
  <section class="lp-sec lp-close"><h2 class="lp-h2">Rest Day mo? Gawin Pay Day!</h2><a class="lp-btn lime lg" href="${href}">Mag-apply ngayon →</a></section>
  <a class="lp-btn lime lp-float" href="${href}">Mag-apply ngayon →</a><footer class="lp-foot"><span>© ${new Date().getFullYear()}</span><span class="lp-staff"><a href="#" data-act="dx-signin">Staff sign in</a> · <a href="#" data-act="dx-signup">Request access</a></span></footer></div>`}
function pendingBlock(){const P=S.accounts.filter(a=>a.pending);if(!P.length)return"";
  return `<div class="sect"><header><h3>Waiting for approval (${P.length})</h3></header><div class="stack">${P.map(u=>`<div class="pend"><div><div>${esc(u.name)}</div><div class="small muted">${esc(u.email||u.username)} · signed up ${fmtDT(u.createdAt)}</div></div>
   <div class="row">${Object.keys(ROLES).map(k=>`<label class="row small pr"><input type="checkbox" class="prole" data-u="${u.id}" value="${k}"> ${ROLES[k]}</label>`).join("")}</div>
   <div class="row"><button class="btn primary sm" data-act="dx-approve" data-id="${u.id}">Approve</button><button class="btn sm danger" data-act="dx-decline" data-id="${u.id}">Decline</button></div></div>`).join("")}</div></div>`}
async function doSignup(){const n=$("#sname").value.trim(),em=$("#semail").value.trim().toLowerCase(),p=$("#spw").value,p2=$("#spw2").value,er=$("#serr");
  if(!n||n.split(/\s+/).length<2)return er.textContent="Enter your full name.";if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email address.";
  if(!pwOk(p))return er.textContent="Password needs at least 8 characters.";if(p!==p2)return er.textContent="Passwords don't match.";
  er.textContent="Sending…";const {data,error}=await SB.auth.signUp({email:em,password:p,options:{data:{name:n},emailRedirectTo:location.href.split("#")[0]}});
  if(error)return er.textContent=error.message;
  if(data.session){const {data:pr}=await SB.from("profiles").select("active,pending").eq("id",data.user.id).maybeSingle();
    if(pr&&pr.active&&!pr.pending){const msg=await enterSession(data.user);if(!msg)return toast("You're the first account, so you're the Admin.")}else await SB.auth.signOut()}
  UI.signedUp=em;render()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act^='dx-']");if(!b)return;e.preventDefault();const A=b.dataset.act,id=b.dataset.id;
  if(A==="dx-landing"){UI.auth="landing";UI.signedUp=null;return render()}
  if(A==="dx-signin"){UI.auth="login";UI.signedUp=null;return render()}
  if(A==="dx-signup"){UI.auth="signup";UI.signedUp=null;return render()}
  if(A==="dx-dosignup")return doSignup();
  if(A==="dx-reset")return;
  if(A==="dx-approve"){const u=S.accounts.find(x=>x.id===id),roles=[...document.querySelectorAll(`.prole[data-u="${id}"]:checked`)].map(x=>x.value);
    if(!roles.length)return toast("Pick at least one role first.");
    const {error}=await SB.from("profiles").update({roles,pending:false,active:true,approved_by:S.uid,approved_at:new Date().toISOString()}).eq("id",id);if(error)return dbErr(error);
    await loadProfiles();render();return toast(u.name+" approved")}
  if(A==="dx-decline"){const u=S.accounts.find(x=>x.id===id);if(!confirm(`Decline ${u.name}'s sign-up?`))return;const r=await adminUsers({action:"delete",user_id:id});if(r.error)return toast(r.error);await loadProfiles();render();return toast("Sign-up declined")}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="spw2")doSignup()});

/* ============ boot ============ */
async function ensureAdmin(){}
async function boot(){
  if(!SB){$("#main").innerHTML=`<div class="auth"><div class="authcard"><div class="brandline">DrayberFlex</div><h1>Not connected</h1><p class="muted">Open <b>config.js</b> and paste your Supabase Project URL and anon public key, then reload.</p></div></div>`;return}
  if(PUB.route){await publicLoad();if(PUB.route==="ticket")await loadTicket(PUB.id);S.ready=true;render()}
  const {data:{session}}=await SB.auth.getSession();
  if(session){let ok=false;try{const ss=JSON.parse(sessionStorage.getItem(SESS)||"null");ok=ss&&ss.uid===session.user.id&&Date.now()-ss.t<(DEFAULT_SETTINGS.idleMinutes||30)*60000}catch(e){}
    if(ok){const msg=await enterSession(session.user);if(!msg)return}else await SB.auth.signOut()}
  if(!PUB.route){if(!S.settings)await publicLoad();S.ready=true;UI.auth=null;render()}}
window.addEventListener("scroll",()=>document.body.classList.toggle("lp-scrolled",scrollY>420),{passive:true});
render();boot();
</script>
