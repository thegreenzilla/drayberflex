<style>
:root{
  /* TAPAT palette: asphalt, lane, signal yellow, plate green, warn red */
  --bg:#f6f6f1;--panel:#ffffff;--sunk:#eef0eb;--ink:#1d2328;--mute:#5b6770;--line:#d9dcd6;
  --go:#1e6b52;--go-soft:#e0eee7;--wait:#8a6200;--wait-soft:#fcf0c8;--stop:#c2412d;--stop-soft:#f8e2dc;
  --road:#283036;--road-2:#37424a;--signal:#f2b705;--signal-ink:#3a2c00;--focus:#f2b705;
  --display:"Inter",system-ui,Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b2125;--panel:#232a2f;--sunk:#2b3338;--ink:#eef0eb;--mute:#a3adb4;--line:#3a454c;
  --go:#3fa37f;--go-soft:#1f3a30;--wait:#f2c94c;--wait-soft:#3b3214;--stop:#e2694f;--stop-soft:#3e231d;
  --road:#12171a;--road-2:#1f262b;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1b2125;--panel:#232a2f;--sunk:#2b3338;--ink:#eef0eb;--mute:#a3adb4;--line:#3a454c;
  --go:#3fa37f;--go-soft:#1f3a30;--wait:#f2c94c;--wait-soft:#3b3214;--stop:#e2694f;--stop-soft:#3e231d;
  --road:#12171a;--road-2:#1f262b;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:40px;line-height:1.05}h2{font-size:26px}h3{font-size:17px;font-family:var(--body);font-weight:700}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
body.full .app{grid-template-columns:1fr}body.full nav.rail{display:none}
nav.rail{background:var(--road);color:#e8ebe6;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:5}
.brand{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1;margin:4px 8px 2px;color:#fff}
.brand-sub{font-size:13px;color:#b8c0c4;margin:2px 8px 14px;line-height:1.35}
.brand-sub span{color:var(--signal)}
.road{height:6px;margin:0 8px 16px;background:repeating-linear-gradient(90deg,var(--signal) 0 18px,transparent 18px 30px);flex:none}
#nav{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8f9aa0;margin:14px 12px 4px}
.rail .search{margin:0 0 6px}
.rail .search input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #4a565e;background:var(--road-2);color:#fff}
.rail .search input::placeholder{color:#b8c0c4}
.rail-foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid #3d4950;font-size:13px;color:#c8cfd2}
.rail-foot b{color:#fff}.rail-foot .navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:#dfe4e0;font-weight:500;white-space:nowrap}
.navbtn:hover{background:var(--road-2)}
.navbtn[aria-current="true"]{background:var(--signal);color:var(--signal-ink);font-weight:700}
.navbtn .n{font-family:var(--display);font-size:15px;opacity:.75}
.rdy{font-family:var(--display);font-size:14px;font-weight:700;background:var(--signal);color:var(--signal-ink);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.offline{background:var(--signal);color:var(--signal-ink);font-weight:500;font-size:13.5px;padding:6px clamp(12px,3vw,40px)}
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.rcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--go);border-radius:8px;padding:14px 16px}
.rcard.none{border-left-color:var(--line)}
.rcard .rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard .rh b{font-family:var(--display);font-size:28px;line-height:1}
.rcard ul{list-style:none;margin:10px 0 0;padding:0}
.rcard li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:14px}
@media (max-width:820px){.app{grid-template-columns:1fr}
 nav.rail{height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:4px}
 .brand-sub,.road,.navlabel,.rail-foot .who,.rail-foot label{display:none}.brand{font-size:22px;margin:0 8px 0 2px}
 #nav{flex-direction:row}.navbtn{width:auto}.rail .search{margin:0;min-width:150px;flex:none}
 .rail-foot{margin:0;border:0;padding:0;display:flex;gap:2px;align-items:center}}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:9px 15px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--go);border-color:var(--go);color:#fff}
.btn.dark{background:var(--road);border-color:var(--road);color:#fff}.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13.5px}
label.f{display:block;font-size:14px;color:var(--ink);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:400}
textarea{resize:vertical;min-height:60px}
.muted{color:var(--mute)}
.small{font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-go{background:var(--go);color:#fff}.t-wait{background:var(--signal);color:var(--signal-ink)}
.t-stop{background:var(--stop);color:#fff}.t-plain{background:var(--sunk);color:var(--mute)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600;background:var(--panel)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--mute)}
/* the route line: the funnel drawn as a delivery route */
.route{overflow-x:auto;padding:6px 2px 4px}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:760px;position:relative}
.route ol::before{content:"";position:absolute;left:24px;right:24px;top:44px;height:12px;border-radius:3px;background:var(--road) repeating-linear-gradient(90deg,var(--signal) 0 14px,transparent 14px 26px) center/100% 2px no-repeat}
.route li{flex:1;position:relative;text-align:center;padding:0 2px}
.route .cnt{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;height:34px}
.route .dot{width:22px;height:22px;border-radius:50%;background:var(--panel);border:5px solid var(--road);margin:6px auto 8px;position:relative}
.route li.on .dot{background:var(--signal);border-color:var(--road)}
.route .lbl{font-size:13px;font-weight:600;line-height:1.25}
.route .pct{font-size:12px;color:var(--mute)}
.mini .route ol{min-width:600px}.mini .route ol::before{top:8px}
.mini .route .dot{margin:0 auto 6px}.mini .route .lbl{font-size:12px}
.mini .route li.now .dot{background:var(--wait);border-color:var(--wait)}
.mini .route li.bad .dot{background:var(--stop);border-color:var(--stop)}
.sample{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--go);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:34px;line-height:1.05}
.kpi span{font-size:14px;color:var(--mute)}
.sect{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sect>header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sect>div{padding:14px 16px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.checks li span:first-child{flex:1}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-child{border-top:0;padding-top:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.opt{min-height:52px;border:2px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14.5px;font-weight:500;background:var(--panel);color:var(--ink);text-align:left;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--mute)}
.opt b,.opt .rk{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--signal);color:var(--signal-ink);font:700 15px var(--display)}
.opt[aria-pressed="true"]{border-color:var(--go);background:var(--go);color:#fff}
.opt.s1[aria-pressed="true"]{border-color:var(--stop);background:var(--stop);color:#fff}
.opt.s2[aria-pressed="true"]{border-color:#b98a00;background:var(--signal);color:var(--signal-ink)}
.pf{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pf button{border:0;background:var(--panel);padding:4px 11px;cursor:pointer;font-weight:600;font-size:13px}
.pf button+button{border-left:1px solid var(--line)}
.pf button[aria-pressed="true"].p{background:var(--go);color:#fff}
.pf button[aria-pressed="true"].x{background:var(--stop);color:#fff}
.verdict{display:flex;gap:16px;align-items:center;padding:16px;border-radius:10px}
.verdict b{font-family:var(--display);font-size:40px;line-height:1}
.v-go{background:var(--go-soft);color:var(--go)}.v-stop{background:var(--stop-soft);color:var(--stop)}.v-wait{background:var(--wait-soft);color:var(--wait)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:9}
.letter{background:#fff;color:#16212B;border:1px solid var(--line);border-radius:8px;padding:28px;max-width:720px;font-size:14.5px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--road)}
.authcard{background:var(--panel);color:var(--ink);border-radius:12px;padding:28px;width:min(400px,100%)}
.authcard h1{font-size:26px}.authcard .brandline{font-family:var(--display);font-weight:700;color:var(--go);margin-bottom:14px}
.err{color:var(--stop);font-size:13.5px;margin:0}
/* ---- v3 UX ---- */
.search{position:relative}
.search input{width:210px;padding:7px 10px;border-radius:7px;border:1px solid rgba(127,127,127,.5);background:rgba(127,127,127,.12);color:inherit}
.search input::placeholder{color:inherit;opacity:.65}
#gres,#dropdown{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;z-index:15}
#gres{position:fixed;width:340px;max-width:92vw}
#dropdown{position:fixed;min-width:240px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:inherit}
.mi:hover,.mi.hl{background:var(--sunk)}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--go);color:#fff;font:700 12px var(--display)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-bottom:10px}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px}
.step{flex:1 0 132px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:0 9px;align-items:center;color:var(--ink)}
.step .ic{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);background:var(--sunk);color:var(--mute)}
.step.done .ic{background:var(--go);color:#fff}.step.now .ic{background:var(--wait);color:#fff}.step.fail .ic{background:var(--stop);color:#fff}
.step b{font-size:13.5px;line-height:1.2}.step small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.locked{opacity:.55}
.step[aria-selected="true"]{border-color:var(--road);box-shadow:inset 0 -4px 0 var(--signal)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--go-soft);color:var(--go);border:1px solid var(--go);border-radius:10px;padding:12px 16px;font-weight:600;margin-bottom:16px}
.ivbar{position:sticky;top:calc(var(--hh,58px) + 8px);z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.ivbar .bar{flex:1;min-width:120px}
.ivbar .sc{font:700 22px var(--display)}
.oneq{border:1px solid var(--line);border-radius:12px;padding:18px}
.oneq .qt{font:700 clamp(19px,2.6vw,24px)/1.25 var(--display);margin:6px 0 14px}
.oneq .opts{grid-template-columns:1fr}
.oneq .opt{padding:13px 14px;font-size:15px}
.kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.qdots{display:flex;flex-wrap:wrap;gap:5px}
.qdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:600 11px var(--display);cursor:pointer;color:var(--mute)}
.qdot.a{background:var(--go);border-color:var(--go);color:#fff}.qdot.r{background:var(--stop);border-color:var(--stop);color:#fff}.qdot.cur{outline:2px solid var(--ink);outline-offset:1px}
.doc{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.doc+.doc{margin-top:10px}
.doc.open{border-color:var(--mute)}
.dh{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:13px 16px;cursor:pointer;color:inherit}
.dh .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);background:var(--sunk);color:var(--mute)}
.doc.ok .dh .ic{background:var(--go);color:#fff}.doc.bad .dh .ic{background:var(--stop);color:#fff}
.db{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.ck{list-style:none;padding:0;margin:0}
.ck li{display:flex;gap:9px;align-items:center;padding:5px 0}
.ck i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ck .y{background:var(--go);color:#fff}.ck .n{background:var(--stop);color:#fff}.ck .u{background:var(--sunk);color:var(--mute)}
.attend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.attend .btn{min-height:48px;padding:10px 22px;font-size:16px}
.tm{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.tm>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px clamp(14px,3vw,28px);background:var(--road);color:var(--bg)}
.tm>header .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.6)}
.tm-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:780px;width:100%;margin:0 auto;padding:24px 18px}
.tm-q{font:700 clamp(24px,4.2vw,36px)/1.2 var(--display);margin:10px 0 26px}
.tm-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tmb{min-height:140px;border-radius:16px;border:3px solid;background:var(--panel);font:700 32px var(--display);cursor:pointer;letter-spacing:.03em}
.tmb.pass{color:var(--go);border-color:var(--go)}.tmb.fail{color:var(--stop);border-color:var(--stop)}
.tmb.pass[aria-pressed="true"]{background:var(--go);color:#fff}.tmb.fail[aria-pressed="true"]{background:var(--stop);color:#fff}
.tmb small{display:block;font:500 13px var(--body);opacity:.7;letter-spacing:0}
.tm-nav{display:flex;justify-content:space-between;margin-top:20px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.dotb{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:600 13px var(--display);cursor:pointer;color:var(--mute)}
.dotb.p{background:var(--go);border-color:var(--go);color:#fff}.dotb.x{background:var(--stop);border-color:var(--stop);color:#fff}.dotb.cur{outline:3px solid var(--ink);outline-offset:2px}
@media (pointer:coarse){.btn{min-height:44px;padding:10px 16px}.btn.sm{min-height:40px;padding:8px 12px}.pf button{padding:10px 16px;font-size:15px}
 .opt{padding:12px;font-size:15px}.navbtn{padding:10px 12px}.step{padding:12px}.mi{padding:12px}
 label.f input,label.f select,label.f textarea{padding:10px 11px;font-size:16px}.search input{font-size:16px}}

.calbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.calbar h2{font-size:19px}
.calwrap{overflow-x:auto;padding-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:840px}
.cal .dow{font-size:12px;font-weight:600;color:var(--mute);padding:0 4px}
.cday{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;min-width:0;color:var(--ink)}
.cday:hover{border-color:var(--mute)}
.cal.week .cday{min-height:170px}.cal.month .cday{min-height:92px}

/* ---- v10 warm navy/blue ---- */
:root[data-theme="light"],:root:not([data-theme="dark"]){--brand:#1078bd;--brand-soft:#deebf7;--navy:#23215e}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ece9e3;--panel:#ffffff;--sunk:#f9f7f2;--line:#e3dfd7;--ink:#23215e;--mute:#6e6d7c}}
:root[data-theme="light"]{--bg:#f8f7f4;--panel:#ffffff;--sunk:#fbfaf8;--line:#e8e5df;color-scheme:light;--ink:#23215e;--mute:#6e6d7c}
:root[data-theme="dark"]{--brand:#4aa3e0;--brand-soft:#1b3346;--navy:#eef0eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#4aa3e0;--brand-soft:#1b3346;--navy:#eef0eb}}
body{font-family:var(--body);font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3{color:var(--ink);font-weight:800;letter-spacing:-.03em;line-height:1.05}
h1{font-size:clamp(32px,4vw,46px)}h2{font-weight:700;letter-spacing:-.02em}h3{font-weight:700;letter-spacing:-.015em;line-height:1.25}
.head p,.muted{color:var(--mute)}
.brand{color:var(--ink);font-weight:800;letter-spacing:-.03em}
nav.rail{background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navbtn{border-radius:99px;font-weight:600;color:var(--ink)}
.navbtn:hover{background:var(--panel)}
.navbtn[aria-current="true"]{background:var(--panel);color:var(--brand);font-weight:700;box-shadow:0 2px 10px rgba(35,33,94,.06)}
.rail .search input{background:var(--panel);border-radius:99px;border-color:var(--line)}
.avatar{background:var(--brand)}
.panel,.sect,.tablewrap,.doc,.kpi,.rcard,.oneq,.hero,.ap-card,.steps,#dropdown{background:var(--panel);border:1px solid color-mix(in oklab,var(--line) 60%,transparent);border-radius:22px;box-shadow:0 12px 34px rgba(35,33,94,.06)}
.sect>header h3{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:0}
.btn{border-radius:14px;font-weight:600;padding:11px 18px;background:var(--sunk);border-color:var(--line);color:var(--ink)}
.btn.sm{border-radius:10px}
.btn.primary,.hero .btn.signal{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px color-mix(in oklab,var(--brand) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.lg{min-height:56px;border-radius:16px;font-size:17px}
label.f{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
label.f>span,label.f .small{text-transform:none;letter-spacing:0;font-weight:400}
label.f input,label.f select,label.f textarea{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:500 16px var(--body);color:var(--ink);margin-top:8px}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--brand);outline-offset:1px;background:var(--panel)}
th{background:none;color:var(--mute);font-weight:600;letter-spacing:.09em}
.tag{border-radius:99px;font-weight:600}
.hero{padding:30px 32px}.hero h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.03em}
.hero .eyebrow,.ap-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--brand);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
.hero .eyebrow::before,.ap-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:#1f9d63}
.qrow{border-radius:22px;padding:22px}
.qrow .qc{font-weight:800;letter-spacing:-.03em;font-size:48px}
.qrow .qt b{font-weight:700}
.qrow .qn{font-weight:700}
.kpi b{font-weight:800;letter-spacing:-.03em}
.flow .fs{border-radius:99px;font-weight:600}.flow li.cur .fs{background:var(--brand);border-color:var(--brand)}.flow li.cur .fs i{color:var(--brand)}
.step[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--brand)}
.ap{background:var(--bg)}.ap-top{background:transparent;border-bottom:0}.ap-brand{color:var(--ink);font-weight:800;letter-spacing:-.03em}
.ap-card h1{font-size:clamp(36px,6vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1}
.ap-card h1+p{font-size:19px}
.ap-steps li{font-weight:600}.ap-steps li.on{border-color:var(--brand)}
.ap-note{background:var(--sunk);border-radius:16px}
.ap-d.open{background:var(--brand-soft);color:var(--brand);font-weight:600}.ap-d.open:hover,.ap-d.sel{background:var(--brand);color:#fff}
.ap-t{border-color:var(--brand);color:var(--brand);border-radius:14px;font-weight:600}.ap-t:hover{background:var(--brand-soft)}
.ap-tsel span{background:var(--navy);color:var(--panel);border-radius:14px}
.ap-check{background:#dff3e8;color:#1f9d63;border-radius:16px}
.ap-code{font-weight:700;color:var(--ink)}
.cp-day span{border-radius:99px;font-weight:600}.cp-day input:checked+span{background:var(--brand);border-color:var(--brand)}
.cp-url{border-radius:12px}
.mi{border-radius:10px;font-weight:500}.mi .sn{background:var(--brand-soft);color:var(--brand);font-weight:700}
.authcard{border-radius:22px}

/* ---- v11 landing ---- */
.lp{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#0b2140 0%,transparent 60%),#030f1f;color:#eef2f8;font-family:"Montserrat",var(--body)}

.lp-logo{font:800 22px "Montserrat",sans-serif;letter-spacing:-.02em;color:#fff}.lp-logo span{color:#8fd14f}
.lp-act{display:flex;gap:10px}
.lp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:12px;font:600 15px "Montserrat",sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent}
.lp-btn.ghost{background:transparent;color:#eef2f8;border-color:#22344f}.lp-btn.ghost:hover{border-color:#8fd14f;color:#fff}
.lp-btn.lime{background:#8fd14f;color:#08160a}.lp-btn.lime:hover{background:#a2de66;color:#08160a}
.lp-btn.lg{min-height:56px;padding:14px 28px;font-size:17px;margin-top:34px}
.lp-hero{max-width:1440px;margin:0 auto;padding:clamp(40px,7vw,90px) clamp(18px,4vw,64px) 0}
.lp-eye{font:400 13px "Space Mono",monospace;letter-spacing:.42em;text-transform:uppercase;color:#8fd14f}
.lp-h1{font:700 clamp(40px,6.4vw,92px)/1.02 "Montserrat",sans-serif;letter-spacing:-.03em;color:#f4f6fb;margin:26px 0 0;max-width:15ch}
.lp-sub{font-size:clamp(17px,1.5vw,21px);line-height:1.6;color:#a9b4c4;max-width:34ch;margin:30px 0 0}
.lp-steps{--b:#16263d;max-width:1440px;margin:clamp(48px,7vw,90px) auto 0;padding:0 clamp(18px,4vw,64px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.lp-step{background:#061830;border:1px solid var(--b);border-left:0;padding:34px 30px 40px}
.lp-step:first-child{border-left:1px solid var(--b);border-radius:20px 0 0 20px}.lp-step.last{border-radius:0 20px 20px 0}
.lp-n{font:400 13px "Space Mono",monospace;letter-spacing:.2em;color:#7d8aa0}
.lp-step h3{font:700 19px/1.35 "Montserrat",sans-serif;letter-spacing:-.01em;color:#f4f6fb;margin:26px 0 12px}
.lp-step p{margin:0;color:#a9b4c4;font-size:15.5px;line-height:1.65}
.lp-step.last .lp-n,.lp-step.last h3{color:#8fd14f}
@media (max-width:1100px){.lp-steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lp-step,.lp-step:first-child,.lp-step.last{border:1px solid var(--b);border-radius:18px}}
@media (max-width:620px){.lp-steps{grid-template-columns:1fr}.lp-top .lp-btn{padding:8px 14px}}
.lp-foot{max-width:1440px;margin:0 auto;padding:60px clamp(18px,4vw,64px) 40px;color:#5f6d82;font-size:13px}
.auth{background:#030f1f!important}
.authcard .brandline{font:800 20px "Montserrat",sans-serif;color:var(--ink)}
.lp-back{background:none;border:0;color:var(--mute);cursor:pointer;padding:0;margin-bottom:14px;font-size:14px}
.pend{display:grid;grid-template-columns:minmax(180px,1fr) 2fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.pend:last-child{border-bottom:0}

@media (max-width:820px){.pend{grid-template-columns:1fr}}

/* ---- v12 pre-profile & approval ---- */
#nav{overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}.navbtn{flex:none}
@media (max-width:1200px){.rail .search{width:150px}.navbtn{padding:8px 10px}}
.agechip{display:inline-block;vertical-align:middle;margin-left:10px;font-size:14px;font-weight:600;letter-spacing:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:3px 10px}
.ap-h3{margin:28px 0 12px;font-size:17px}
.ap-codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.ap-code-c{position:relative}.ap-code-c input{position:absolute;opacity:0;pointer-events:none}
.ap-code-c span{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer;min-height:56px}
.ap-code-c b{font-size:16px}.ap-code-c small{font-size:12.5px;color:var(--mute)}
.ap-code-c input:checked+span{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.ap-code-c input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.ap-q{border:0;padding:0;margin:22px 0 0}.ap-q legend{font-weight:600;font-size:16px;margin-bottom:10px;padding:0}
.ap-qo{display:grid;gap:8px}.ap-qo label{position:relative}.ap-qo input{position:absolute;opacity:0;pointer-events:none}
.ap-qo span{display:block;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer;min-height:48px}
.ap-qo input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600;box-shadow:inset 0 0 0 1px var(--brand)}
.ap-qo input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.ap-check.wait{background:var(--wait-soft);color:var(--wait);font-size:24px}
.cq{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.cq-in{width:100%;font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.cq-in{resize:vertical;font-weight:400}
.rq{display:grid;gap:14px}.rq-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.rq-score{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:86px;padding:10px 14px;border-radius:16px}
.rq-score b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}.rq-score small{font-size:12px;margin-top:3px}
.rq-score.ok{background:#dff3e8;color:#16774a}.rq-score.low{background:var(--stop-soft);color:var(--stop)}

.rq-q{font-size:14px;color:var(--mute)}.rq-q::before{content:counter(q) ". ";font-weight:700;color:var(--ink)}
.rq-a{display:flex;justify-content:space-between;align-items:center;gap:12px}.rq-a b{font-size:15.5px;color:var(--ink)}

.rq-ans li.full .rq-pts{background:#dff3e8;color:#16774a}.rq-ans li.part .rq-pts{background:var(--wait-soft);color:var(--wait)}.rq-ans li.low .rq-pts{background:var(--stop-soft);color:var(--stop)}

/* ---- v13 doc upload ---- */
label.f select{appearance:none;-webkit-appearance:none;min-height:52px;padding-right:40px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%236e6d7c%27 stroke-width=%271.6%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center}
.ap-link{background:none;border:0;padding:4px 0;color:var(--brand);font:600 14.5px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ap-addr{padding:14px 16px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}.ap-addr div{font-weight:600;margin-top:2px}
.ap-yn{grid-template-columns:1fr 1fr}
label.f input::placeholder,label.f textarea::placeholder{color:#a3a1ad;font-weight:400;opacity:1}
.ap-drop{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px dashed color-mix(in oklab,var(--brand) 45%,var(--line));border-radius:16px;background:var(--brand-soft);cursor:pointer;margin-bottom:16px}

.ap-drop:focus-within{outline:2px solid var(--brand);outline-offset:2px}

@keyframes apspin{to{transform:rotate(360deg)}}
@media (max-width:480px){.ap-upd{grid-template-columns:1fr}.ap-upd img{width:100%;height:160px}}

/* ---- v15 applicant camera ---- */
.ap-cap{display:grid;gap:10px;margin-bottom:16px}
.ap-cap-main{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 20px;border:1.5px dashed color-mix(in oklab,var(--brand) 45%,var(--line));border-radius:16px;background:var(--brand-soft);cursor:pointer;color:var(--ink);font:inherit}
.ap-cap-main:hover{border-color:var(--brand)}.ap-cap-main b{display:block}.ap-cap-main small{display:block;color:var(--mute);margin-top:2px}
.ap-cap-alt{position:relative;justify-self:center;color:var(--brand);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
.ap-cap-alt input{position:absolute;inset:0;opacity:0;cursor:pointer}
.snap{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column}
.snap.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:snapf .25s ease-out forwards}@keyframes snapf{from{opacity:.9}to{opacity:0}}
.snap-top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}
.snap-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
.snap-stage{position:relative;flex:1;overflow:hidden}
.snap-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.snap-mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.snap-frame{position:relative;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);border-radius:14px}
.snap-frame.card{width:min(88vw,calc((100vh - 260px)*1.586),620px);aspect-ratio:85.6/54}
.snap-frame.page{height:min(70vh,calc(88vw*1.3));aspect-ratio:1/1.3}
.snap-frame i{position:absolute;width:28px;height:28px;border:3px solid #8fd14f}
.snap-frame i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.snap-frame i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.snap-frame i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.snap-frame i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.snap-tip{position:absolute;left:0;right:0;bottom:18px;margin:0;text-align:center;font-size:15px;padding:0 20px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.snap-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.snap-shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:none;padding:5px;cursor:pointer}
.snap-shut span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}.snap-shut:active span{transform:scale(.92)}
.snap-flip{justify-self:end;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}

function monthsAgo(dateStr){const d=new Date(dateStr);if(isNaN(d))return Infinity;return (Date.now()-d)/(1000*60*60*24*30.44)}
function docIssues(a){
  const s=settings(),d=a.docs||{},iss={nbi:[],medical:[],license:[]};
  if(!d.nbi?.ref)iss.nbi.push("Clearance number missing");
  if(!d.nbi?.expiry)iss.nbi.push("Validity date missing");else if(d.nbi.expiry<today())iss.nbi.push("Expired");
  if(d.nbi?.hit)iss.nbi.push("Has a record hit");
  if(!d.medical?.date)iss.medical.push("Issue date missing");else if(monthsAgo(d.medical.date)>s.medicalMaxMonths)iss.medical.push(`Older than ${s.medicalMaxMonths} months`);
  if(d.medical&&d.medical.fit===false)iss.medical.push("Not declared fit to work");
  if(!d.license?.number)iss.license.push("Licence number missing");
  if(!d.license?.expiry)iss.license.push("Expiry date missing");else if(d.license.expiry<today())iss.license.push("Expired");
  if(s.requirePro&&d.license?.type!=="professional")iss.license.push("Professional licence required");
  return iss;
}

  async get(k){const {data,error}=await SB.storage.from("docs").download(k+".jpg");if(error||!data)return null;return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(data)})},

function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};img.src=url})}

/* ============ reminders ============ */
function addDays(day,n){const [y,m,d]=day.split("-").map(Number);return localDay(new Date(y,m-1,d+n))}
function tomorrowDay(){return addDays(today(),1)}
function weekStart(day){const [y,m,d]=day.split("-").map(Number),dt=new Date(y,m-1,d);return addDays(day,-((dt.getDay()+6)%7))}
function remindTarget(){return UI.remDate||tomorrowDay()}
function remindList(day){day=day||tomorrowDay();return list().filter(a=>stage(a)==="booked"&&localDay(a.slot)===day).sort((a,b)=>(a.slot||"").localeCompare(b.slot||""))}
function dayApps(day){return list().filter(a=>a.slot&&localDay(a.slot)===day).sort((a,b)=>(a.slot||"").localeCompare(b.slot||""))}
function chipState(a){const st=stage(a);return st==="canceled"?"cx":st==="noshow"?"ns":st==="booked"?(a.reminder?"sent":"todo"):"done"}
function reminderMsg(a){const s=settings(),d=new Date(a.slot);
  return s.reminderText.replace(/\{code\}/g,a.code||"").replace(/\{first\}/g,(a.name||"").split(" ")[0]).replace(/\{name\}/g,a.name||"").replace(/\{address\}/g,a.location||s.hubAddress)
   .replace(/\{date\}/g,isNaN(d)?"":d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})).replace(/\{time\}/g,isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}
function vReminders(){
  const sel=remindTarget(),mode=UI.calMode||"week",tdy=today();
  const anchor=UI.calAnchor||sel,[ay,am]=anchor.split("-").map(Number);
  let days,title;
  if(mode==="week"){const ws=weekStart(anchor);days=Array.from({length:7},(_,i)=>addDays(ws,i));
    const f=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});title=`${f(days[0])} – ${f(days[6])}, ${days[6].slice(0,4)}`}
  else{const first=localDay(new Date(ay,am-1,1)),ws=weekStart(first),last=localDay(new Date(ay,am,0)),n=Math.ceil((Date.parse(last+"T12:00")-Date.parse(ws+"T12:00"))/864e5/7+0.01)*7;
    days=Array.from({length:Math.max(35,n)},(_,i)=>addDays(ws,i));title=new Date(ay,am-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}
  const maxChips=mode==="week"?8:2;

/* ============ profile ============ */
function pf(act,id,val,extra=""){return `<div class="pf" role="group">${["pass","fail"].map(v=>`<button data-act="${act}" data-id="${id}" data-v="${v}" ${extra} aria-pressed="${val===v}" class="${v==="pass"?"p":"x"}">${v==="pass"?"Pass":"Fail"}</button>`).join("")}</div>`}
const STEPS=[["docs","Check-in & documents","verifier"],["orientation","Orientation","orientation"],["interview","Interview","interviewer"],["drive","Driving test","tester"],["decision","Result",null],["training","Training booking",null],["ojt","1-day training","trainer"],["activity","Activity",null]];
const STAGE_STEP={iv_fail:"interview",drive_fail:"drive",pass_inform:"training",training_invite:"training",training_declined:"training",training_book:"training",accr_inform:"ojt",accredited:"ojt",booked:"docs",checkin:"docs",noshow:"docs",docs_fail:"docs",orientation:"orientation",interview:"interview",drive:"drive",not_hired:"decision",ojt:"ojt",ojt_fail:"ojt",offer:"offer",offer_sent:"offer",offer_accepted:"offer",offer_declined:"offer"};
const DOCS=[["nbi","NBI clearance"],["medical","Medical certificate"],["license","Driver's licence"]];
function stepInfo(a){
  const s=settings(),dv=docsVerdict(a),o=a.orientation||{},iv=scoreInterview(a),d=decide(a),ov=ojtVerdict(a),of=a.offer||{},I={};
  I.docs=a.checkin?.status==="noshow"?{st:"fail",sum:"No-show"}:dv==="pass"?{st:"done",sum:"Cleared"}:dv==="fail"?{st:"fail",sum:"Rejected"}:{st:"now",sum:a.checkin?.status?`${DOCS.filter(([k])=>a.docs?.[k]?.status==="verified").length}/3 verified`:"Awaiting check-in"};
  I.orientation=o.attended?{st:"done",sum:`Pulse ${o.pulse}/5`}:dv==="pass"?{st:"now",sum:"Waiting"}:{st:"locked"};
  const ivOk=iv.pct>=s.interviewPass&&!(s.highRiskBlocks&&iv.overall==="High")&&!(s.redFlagBlocks&&iv.red.length);
  I.interview=a.interview?.done?{st:ivOk?"done":"fail",sum:`${iv.pct}% · ${iv.overall} risk`}:o.attended?{st:"now",sum:`${iv.answered}/${iv.total} answered`}:{st:"locked"};
  I.drive=a.drive?.result?{st:a.drive.result==="pass"?"done":"fail",sum:`${a.drive.result==="pass"?"Pass":"Fail"} · ${a.drive.pct}%`}:a.interview?.done?{st:"now",sum:`${scoreDrive(a).done}/${driveItems().length} scored`}:{st:"locked"};
  I.decision=d.result==="hired"?{st:"done",sum:"Passed"}:d.result==="not_hired"?{st:"fail",sum:"Not passed"}:{st:"locked",sum:"Pending"};
  const t=a.training||{};
  I.training=t.slot?{st:"done",sum:fmtD(t.slot)}:t.response==="declined"?{st:"fail",sum:"Declined"}:a.released?.pass?{st:"now",sum:t.response==="accepted"?"Picking a date":"Waiting for reply"}:d.result==="hired"?{st:"now",sum:"Result to give"}:{st:"locked"};
  I.ojt=ov==="pass"?{st:"done",sum:a.released?.accredited?"Accredited":"Passed"}:ov==="fail"?{st:"fail",sum:"Not passed"}:t.slot?{st:"now",sum:fmtD(t.slot)}:{st:"locked"};
  I.offer=of.status==="accepted"?{st:"done",sum:"Accepted"}:of.status==="declined"?{st:"fail",sum:"Declined"}:ov==="pass"?{st:"now",sum:of.status==="sent"?"Sent":"To prepare"}:{st:"locked"};
  I.activity={st:"info",sum:`${(a.log||[]).length} entries`};return I;
}
function docChecks(a,k){const dd=a.docs?.[k]||{},s=settings();
  if(k==="nbi")return[["Clearance number recorded",!!dd.ref],["Valid until a future date",dd.expiry?dd.expiry>=today():null],["No record “hit”",!dd.hit]];
  if(k==="medical")return[["Issue date recorded",!!dd.date],[`Issued within the last ${s.medicalMaxMonths} months`,dd.date?monthsAgo(dd.date)<=s.medicalMaxMonths:null],["Declared fit to work",dd.fit!==false]];
  return[["Licence number recorded",!!dd.number],["Not expired",dd.expiry?dd.expiry>=today():null],["DL codes recorded",!!((dd.restrictions||"").trim()||a.application?.codes?.length)]];
}
function docSummary(a,k){const dd=a.docs?.[k]||{};
  if(k==="nbi")return dd.ref?`${dd.ref}${dd.expiry?" · valid to "+fmtD(dd.expiry):""}`:"Not entered yet";
  if(k==="medical")return dd.date?`Issued ${fmtD(dd.date)}${dd.clinic?" · "+dd.clinic:""}`:"Not entered yet";
  return dd.number?`${dd.number}${dd.restrictions?" · "+dd.restrictions:""}`:"Not entered yet";
}

       ${eD?`<div class="row" style="margin-top:14px"><button class="btn primary" data-act="docst" data-id="${id}" data-k="${k}" data-v="verified" ${ready&&stt!=="verified"?"":"disabled"}>${stt==="verified"?"Verified":"Verify "+title.toLowerCase()}</button><button class="btn danger" data-act="docst" data-id="${id}" data-k="${k}" data-v="rejected" ${stt==="rejected"?"disabled":""}>Reject</button></div>
        ${!ready&&stt!=="verified"?`<p class="small muted" style="margin:6px 0 0">Complete the checklist to verify, or reject if the document isn't acceptable.</p>`:""}`:""}</div></div>`:""}</div>`};
  const docsBody=!a.checkin?.status?`<div class="attend"><div><b>Did ${esc(first)} show up?</b><div class="muted small">Interview booked ${fmtDT(a.slot)}</div></div>${eD?`<div class="row"><button class="btn primary" data-act="show" data-id="${id}">Showed up</button><button class="btn" data-act="noshow" data-id="${id}">No-show</button></div>`:""}</div>`
    :a.checkin.status==="noshow"?`<div class="attend"><div>${tag("No-show","stop")} <span class="muted small">Marked ${fmtDT(a.checkin.at)}</span></div>${eD?`<button class="btn" data-act="undoshow" data-id="${id}">Undo</button>`:""}</div>`
    :`<p class="muted small" style="margin:0 0 12px">Checked in ${fmtDT(a.checkin.at)}. Work through each document; the next one opens when you verify.</p>${DOCS.map(docCard).join("")}`;

  // ---- orientation ----
  const eO=can("orientation"),o=a.orientation||{},dv=docsVerdict(a);
  const oBody=dv!=="pass"?`<p class="muted" style="margin:0">Opens once all three documents are verified.</p>`:`<div class="stack">
    <div><b>Pulse: how much does ${esc(first)} want to join the team now?</b><div class="row" style="margin-top:8px"><div class="pf">${[1,2,3,4,5].map(v=>`<button data-act="pulse" data-id="${id}" data-v="${v}" aria-pressed="${o.pulse===v}" class="${v<=2?"x":"p"}" ${eO?"":"disabled"}>${v}</button>`).join("")}</div><span class="small muted">1 not keen · 5 really wants to join</span></div></div>
    <label class="f">What stood out to them<input data-act="ocomment" data-id="${id}" value="${esc(o.comment||"")}" ${eO?"":"disabled"} placeholder="In their words"></label>
    ${o.attended?`<p style="margin:0">${tag("Attended","go")} <span class="small muted">${fmtD(o.at)}</span> ${eO?`<button class="btn sm" data-act="unattend" data-id="${id}">Undo</button>`:""}</p>`
     :eO?`<div><button class="btn primary" data-act="attend" data-id="${id}" ${o.pulse?"":"disabled"}>Mark attended</button>${o.pulse?"":`<span class="small muted" style="margin-left:8px">Record the pulse first</span>`}</div>`:""}</div>`;

  // ---- interview ----
  const eI=can("interviewer"),ans=a.interview?.answers||{},locked=a.interview?.done,qs=questions(),edit=eI&&!locked;
  const riskTag=r=>r?tag(r+" risk",r==="Low"?"go":r==="Medium"?"wait":"stop"):"";
  let ivBody;
  if(!o.attended)ivBody=`<p class="muted" style="margin:0">Opens after orientation.</p>`;
  else if(!qs.length)ivBody=`<p style="margin:0">No questions in the bank yet. ${eI?`<button class="btn sm" data-go="bank">Set up questions</button>`:""}</p>`;
  else{
    const areas=Object.keys(DIMS).filter(k=>qs.some(q=>q.dim===k)),steps=[...areas.map(k=>DIMS[k]),"Result"],last=steps.length-1;
    const areaDone=k=>qs.filter(q=>q.dim===k).every(q=>ans[q.id]);
    let st=UI.ivFor===id&&UI.ivStep!=null?UI.ivStep:(locked?last:Math.max(0,areas.findIndex(k=>!areaDone(k))));
    if(st<0||areas.every(areaDone)&&UI.ivFor!==id)st=last;st=Math.max(0,Math.min(st,last));UI.ivStep=st;UI.ivFor=id;
    const chips=`<div class="ivsteps noprint">${steps.map((t,i)=>`<button class="chip ${i<last&&areaDone(areas[i])?"done":""}" data-act="ivstep" data-v="${i}" aria-pressed="${i===st}">${i+1}. ${esc(t)}</button>`).join("")}</div>
      <div class="progress" aria-label="${iv.answered} of ${iv.total} answered"><i style="width:${iv.total?iv.answered/iv.total*100:0}%"></i></div>`;
    let body;
    if(st<last){const k=areas[st],L=qs.filter(q=>q.dim===k),n=L.filter(q=>ans[q.id]).length;
      body=`<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(DIMS[k])}</h3><span class="small muted">${n} of ${L.length} answered</span></div>
        <p class="muted" style="margin:4px 0 0">Ask each question as written, in English or Filipino. Pick the answer closest to what they said. Probe for a real example, not a promise.</p>
        ${st===0?`<p class="guard">Do not ask or record age, civil status, children, pregnancy, religion or ethnicity (RA 10911). The score advises; the hiring rules decide.</p>`:""}
        ${L.map(q=>`<div class="tq"><div class="meta">${CATS[q.cat]}${+q.weight>1?` · counts ×${q.weight}`:""} ${q.red?tag("Red flag","stop"):""}</div>
          <div class="en">${esc(q.text)}</div>${q.fil?`<div class="fil">${esc(q.fil)}</div>`:""}
          <div class="opts">${[1,2,3,4].map(sc=>`<button class="opt s${sc}" data-act="ans" data-id="${id}" data-q="${q.id}" data-v="${sc}" aria-pressed="${ans[q.id]===sc}" ${edit?"":"disabled"}><span class="rk">${sc}</span><span>${esc(q.o[sc-1])}</span></button>`).join("")}</div>
          <div class="lk-legend"><span>1 = highest risk</span><span>4 = best answer</span></div></div>`).join("")}</div>`}
    else{const rc=iv.overall==="Low"?"r-low":iv.overall==="High"?"r-high":"";
      const miss=areas.map(k=>[k,qs.filter(q=>q.dim===k&&!ans[q.id]).length]).filter(x=>x[1]);
      body=`<div class="panel result ${rc}"><div class="row" style="justify-content:space-between;align-items:flex-end">
          <div><p class="muted" style="margin:0">Interview result</p><h2 style="margin:0;font-size:40px">${iv.overall?esc(iv.overall)+" risk":"Not scored yet"}</h2></div>
          <div style="text-align:right;flex:none"><p class="muted" style="margin:0">Score</p><span class="big">${iv.answered?iv.pct:"–"}</span><span class="muted"> %</span></div></div>
        ${miss.length?`<p class="note" style="color:var(--wait);margin:10px 0 0">Still to answer: ${miss.map(([k,n])=>`${DIMS[k]} (${n})`).join(", ")}.</p>`:""}
        <div class="tbars">${Object.entries(iv.dims).map(([k,v])=>`<div class="tbar"><span>${DIMS[k]}</span><span class="track"><i class="${v.risk==="Low"?"":v.risk==="Medium"?"mid":"hi"}" style="width:${v.pct}%"></i></span><span class="v">${v.pct}% · ${v.risk}</span></div>`).join("")}</div>
        ${iv.red.length?`<p style="margin:12px 0 0"><b>Red flags:</b> ${iv.red.map(q=>tag(DIMS[q.dim]+": "+(q.text.length>48?q.text.slice(0,46)+"…":q.text),"stop")).join(" ")}</p>`:""}
        <p class="note muted small" style="margin:12px 0 0">Rules: pass mark ${s.interviewPass}%.${s.highRiskBlocks?" High overall risk means Not hired.":""}${s.redFlagBlocks?" Any red-flag answer scored 1 means Not hired.":""} Risk per area: 75%+ Low, 50–74% Medium, below 50% High.</p>
        <label class="f" style="margin-top:14px">Interviewer notes<textarea data-act="ivnotes" data-id="${id}" ${edit?"":"disabled"}>${esc(a.interview?.notes||"")}</textarea></label></div>`}
    const nextBtn=st<last?`<button class="btn primary" data-act="ivstep" data-v="${st+1}">Next: ${esc(steps[st+1])} →</button>`
      :eI?(locked?`<div class="row" style="flex:none">${tag("Submitted","go")}<button class="btn" data-act="ivreopen" data-id="${id}">Reopen</button></div>`
        :`<button class="btn primary" data-act="ivsubmit" data-id="${id}" ${iv.answered===iv.total?"":"disabled"}>Submit interview</button>`):(locked?tag("Submitted","go"):"");
    const foot=`<div class="footer-actions noprint"><button class="btn" data-act="ivstep" data-v="${st-1}" ${st?"":"disabled"}>← Back</button>${nextBtn}</div>`;
    const run=st<last?`<div class="panel runscore noprint"><b>Running score:</b> <span>${iv.answered?iv.pct+"%":"–"}</span>${riskTag(iv.overall)}${iv.red.length?tag(iv.red.length+" red flag"+(iv.red.length>1?"s":""),"stop"):""}<span class="muted small">${iv.answered} of ${iv.total} answered</span></div>`:"";
    ivBody=chips+body+foot+run}

  // ---- driving test ----
  const eT=can("tester"),di2=a.drive?.items||{},dLocked=!!a.drive?.result;
  const drBody=!locked?`<p class="muted" style="margin:0">Opens after the interview is submitted.</p>`:`${eT&&!dLocked?`<div class="attend panel" style="margin-bottom:14px;padding:14px"><div><b>Scoring in the vehicle?</b><div class="small muted">Test mode shows one item at a time with large Pass / Fail buttons.</div></div><button class="btn primary" data-act="testmode" data-id="${id}">Start test mode</button></div>`:""}
    <ul class="checks">${driveItems().map(i=>`<li><span>${esc(i.t)} ${(i.weight>1?tag("×"+i.weight+" points","plain")+" ":"")+(i.crit?tag("Critical","stop"):"")}</span>${pf("drv",id,di2[i.id],`data-i="${i.id}" ${eT&&!dLocked?"":"disabled"}`)}</li>`).join("")}</ul>
    <label class="f" style="margin-top:10px">Tester notes<textarea data-act="drnotes" data-id="${id}" ${eT&&!dLocked?"":"disabled"}>${esc(a.drive?.notes||"")}</textarea></label>
    <div class="row" style="margin-top:12px">${dr.done?`<span>${dr.pct}% · pass mark ${s.drivePass}%</span>`:""}${dr.critFail.length?tag("Critical item failed","stop"):""}
     ${eT?(dLocked?`${tag(a.drive.result==="pass"?"Passed":"Failed",a.drive.result==="pass"?"go":"stop")}<button class="btn sm" data-act="drreopen" data-id="${id}">Reopen</button>`:`<button class="btn primary" data-act="drsubmit" data-id="${id}" ${dr.result?"":"disabled"}>Submit driving test (${dr.done}/${driveItems().length})</button>`)
       :dLocked?tag(a.drive.result==="pass"?"Passed":"Failed",a.drive.result==="pass"?"go":"stop"):""}</div>`;

  // ---- decision ----
  const vd=d.result;
  const decBody=`<div class="verdict ${vd==="hired"?"v-go":vd==="not_hired"?"v-stop":"v-wait"}"><b>${vd==="hired"?"Passed":vd==="not_hired"?"Not passed":"Pending"}</b>
    <span>${vd==="hired"?(a.released?.pass?"Result given. Invited to the 1-day paid training.":"Check-in gives the result, then the applicant is invited to the 1-day paid training."):vd==="not_hired"?(a.released?.fail?"Result given to the applicant.":"Check-in will tell the applicant."):"The result appears when every step is complete."}</span></div>
    <ul class="checks" style="margin-top:12px">${d.checks.map(c=>`<li><span>${c.label}</span><span class="small muted">${esc(c.why||"")}</span>${tag(c.st==="pass"?"Met":c.st==="fail"?"Not met":"Waiting",c.st==="pass"?"go":c.st==="fail"?"stop":"plain")}</li>`).join("")}</ul>`;

  // ---- OJT ----
  const eJ=can("trainer"),days=a.ojt?.days||[],ov=ojtVerdict(a);
  const ojtBody=!a.training?.slot?`<p class="muted" style="margin:0">Opens when the applicant books a training date.</p>`:`<ul class="checks">${Array.from({length:s.ojtDays},(_,i)=>{const dd=days[i]||{};return `<li style="flex-wrap:wrap"><span style="flex:0 0 56px"><b>Day ${i+1}</b></span>
     <input type="date" aria-label="Day ${i+1} date" data-act="ojtf" data-id="${id}" data-i="${i}" data-f="date" value="${esc(dd.date||"")}" ${eJ?"":"disabled"} style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)">
     <input aria-label="Day ${i+1} notes" data-act="ojtf" data-id="${id}" data-i="${i}" data-f="notes" value="${esc(dd.notes||"")}" placeholder="Trainer notes" ${eJ?"":"disabled"} style="flex:1;min-width:160px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel)">
     ${pf("ojtst",id,dd.status,`data-i="${i}" ${eJ?"":"disabled"}`)}</li>`}).join("")}</ul>
     <p style="margin:10px 0 0">${ov==="pass"?tag("Training passed","go"):ov==="fail"?tag("Training not passed","stop"):tag(`${days.filter(x=>x&&x.status==="pass").length} of ${s.ojtMinPass} passing days needed`,"wait")}</p>`;

  // ---- offer ----
  const eH=can("hr"),of=a.offer||{};
  const offBody=ov!=="pass"?`<p class="muted" style="margin:0">Opens when OJT is passed.</p>`:`<div class="stack"><div class="grid2">
     <label class="f">Position<input data-act="offf" data-id="${id}" data-f="position" value="${esc(of.position||s.position)}" ${eH?"":"disabled"}></label>
     <label class="f">Start date<input type="date" data-act="offf" data-id="${id}" data-f="start" value="${esc(of.start||"")}" ${eH?"":"disabled"}></label>
     <label class="f">Assigned hub<input data-act="offf" data-id="${id}" data-f="hub" value="${esc(of.hub||"")}" placeholder="e.g. Cavite hub" ${eH?"":"disabled"}></label>
     <label class="f">Compensation (as stated on letter)<input data-act="offf" data-id="${id}" data-f="pay" value="${esc(of.pay||"")}" ${eH?"":"disabled"}></label></div>
     <div class="row">${of.status&&of.status!=="draft"?tag({sent:"Offer sent",accepted:"Accepted",declined:"Declined"}[of.status],of.status==="accepted"?"go":of.status==="declined"?"stop":"wait"):""}
      ${eH?`<button class="btn" data-act="letter" data-id="${id}">${UI.letter===id?"Hide letter":"Preview offer letter"}</button>
      ${of.status!=="sent"&&of.status!=="accepted"?`<button class="btn primary" data-act="offst" data-id="${id}" data-v="sent" ${of.start?"":"disabled title='Set a start date first'"}>Mark offer sent</button>`:""}
      ${of.status==="sent"?`<button class="btn primary" data-act="offst" data-id="${id}" data-v="accepted">Accepted</button><button class="btn danger" data-act="offst" data-id="${id}" data-v="declined">Declined</button>`:""}`:""}</div>
     ${UI.letter===id?`<div class="letter">${letterHTML(a)}</div><div class="row noprint"><button class="btn" data-act="dlletter" data-id="${id}">Download letter</button><button class="btn" data-act="print">Print</button></div>`:""}</div>`;

  const logs=(a.log||[]).slice(0,30);
  const actBody=`<ul class="checks">${logs.map(l=>`<li><span>${esc(l.msg)}</span><span class="small muted">${esc(S.profiles[l.by]?.name||"")} · ${fmtDT(l.t)}</span></li>`).join("")||`<li class="muted">No activity yet.</li>`}</ul>`;

  const tr=a.training||{},rl=a.released||{},eV=can("verifier");
  const trBody=`<ul class="checks">
    <li><span>Result given to applicant</span>${rl.pass?tag("Given "+fmtDT(rl.pass.at),"go"):vd==="hired"?(eV?`<button class="btn sm primary" data-act="rel-pass" data-id="${id}">Passed</button>`:tag("Waiting for Check-in","wait")):tag("Not yet","plain")}</li>
    <li><span>Applicant's reply</span>${tr.response==="accepted"?tag("Accepted "+fmtDT(tr.respondedAt),"go"):tr.response==="declined"?tag("Declined "+fmtDT(tr.respondedAt),"stop"):tag(rl.pass?"Waiting":"Not yet","plain")}</li>
    <li><span>Training date</span>${tr.slot?`<b>${fmtD(tr.slot)}</b>${tr.changes?` <span class="small muted">(changed once)</span>`:""}`:tag("Not booked","plain")}</li>
    <li><span>Accredited result given</span>${rl.accredited?tag("Given "+fmtDT(rl.accredited.at),"go"):ov==="pass"?(eV?`<button class="btn sm primary" data-act="rel-accr" data-id="${id}">Accredited</button>`:tag("Waiting for Check-in","wait")):tag("Not yet","plain")}</li>
    ${failInfo(a)?`<li><span>"Not passed" result given</span>${rl.fail?tag("Given "+fmtDT(rl.fail.at),"stop"):eV?`<button class="btn sm danger" data-act="rel-fail" data-id="${id}">Failed</button>`:tag("Waiting for Check-in","wait")}</li>`:""}
   </ul><p class="small muted" style="margin:10px 0 0">The applicant sees each result on their phone only after Check-in taps the button.</p>`;
  const bodies={docs:docsBody,orientation:oBody,interview:ivBody,drive:drBody,decision:decBody,training:trBody,ojt:ojtBody,offer:offBody,activity:actBody};
  const edits={docs:eD,orientation:eO,interview:eI,drive:eT,decision:true,training:true,ojt:eJ,offer:eH,activity:true};
  const extra={interview:o.attended&&qs.length?`<button class="btn sm noprint" data-act="printsheet" data-k="interview" data-id="${id}">Print sheet</button>`:"",
    drive:locked?`<button class="btn sm noprint" data-act="printsheet" data-k="drive" data-id="${id}">Print sheet</button>`:""};
  const title=STEPS.find(x=>x[0]===tab)[1];
  const task=info[tab]&&info[tab].st==="now"&&edits[tab]&&TASK[tab]?`<div class="task noprint"><b>Your task</b><span>${TASK[tab]}</span></div>`:"";

  let banner="";
  if(UI.justDone&&UI.justDone.id===id){const {q,a:nx}=nextInQueue(UI.justDone.step,id);
    banner=`<div class="banner" role="status"><span>✓ ${esc(UI.justDone.msg)}</span><div class="row">${q?(nx?`<button class="btn primary" data-open="${nx.id}" data-sec="${q.sec}">Next: ${esc(nx.name)} →</button>`:`<span class="small">No one else is waiting for ${q.label.toLowerCase()}.</span>`)+`<button class="btn" data-go="${q.view}">Back to queue</button>`:""}</div></div>`}
  const fromQ=QUEUES.find(q=>q.view===UI.back),nq=fromQ?readyList(fromQ).filter(x=>x.id!==id):[];
  return `${banner}<div class="head"><div><button class="btn sm noprint" data-go="${UI.back||"applicants"}">← ${fromQ?fromQ.short:UI.back==="pipeline"?"Home":UI.back==="scan"?"Scanner":"Applicants"}</button>
    <h1 style="margin-top:10px">${esc(a.name)}${a.source==="sample"?'<span class="sample">Sample</span>':""}${ageTxt(a)}</h1>
    <p>${a.phone?esc(a.phone):(can("verifier")||can("marketing")?`<input data-act="setphone" data-id="${id}" placeholder="Add mobile number" aria-label="Mobile number" style="padding:3px 8px;border:1px solid var(--wait);border-radius:6px;background:var(--panel);width:170px">`:"No mobile number")}${a.email?" · "+esc(a.email):""} · Interview ${fmtDT(a.slot)} · ${esc(a.campaign||"No campaign")}</p>
    <p class="small" style="margin:4px 0 0">Referral code: ${a.refCode?`<b>${esc(a.refCode)}</b>`:""}${can("marketing")?`<input data-act="setref" data-id="${id}" value="" placeholder="${a.refCode?"Change":"Add code"}" aria-label="Referral code" style="margin-left:6px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:110px">`:a.refCode?"":`<span class="muted">none</span>`}</p></div>
    <div class="row">${stageTag(a)}<button class="btn sm noprint" data-act="tab" data-v="activity" aria-pressed="${tab==="activity"}">Activity (${(a.log||[]).length})</button>${fromQ&&nq.length&&!banner?`<button class="btn sm noprint" data-open="${nq[0].id}" data-sec="${fromQ.sec}">Next in queue →</button>`:""}${S.isAdmin?`<button class="btn sm danger noprint" data-act="delapp" data-id="${id}">Delete</button>`:""}</div></div>
  <div class="steps noprint" role="tablist" aria-label="Hiring steps">${STEPS.filter(x=>x[0]!=="activity").map(([k,l],i)=>{const inf=info[k];return `<button class="step ${inf.st}" role="tab" aria-selected="${tab===k}" data-act="tab" data-v="${k}"><span class="ic">${inf.st==="done"?"✓":inf.st==="fail"?"✕":k==="activity"?"≡":i+1}</span><b>${l}</b><small>${esc(inf.sum||"Not yet")}</small></button>`}).join("")}</div>
  <section class="sect" style="margin-top:12px" role="tabpanel"><header><h3>${title}</h3><div class="row">${extra[tab]||""}${edits[tab]?"":tag("View only","plain")}</div></header><div>${task}${bodies[tab]}</div></section>`;
}

/* ============ driving test mode (tablet) ============ */
function vTestMode(){
  const tm=UI.testMode,a=S.applicants[tm.id];if(!a){UI.testMode=null;return vPipeline()}
  const it=a.drive?.items||{},n=driveItems().length,idx=Math.max(0,Math.min(tm.idx,n)),dr=scoreDrive(a),s=settings();
  const dots=`<div class="dots">${driveItems().map((x,i)=>`<button class="dotb ${it[x.id]==="pass"?"p":it[x.id]==="fail"?"x":""} ${i===idx?"cur":""}" data-act="tmgo" data-v="${i}" aria-label="Item ${i+1}">${i+1}</button>`).join("")}<button class="dotb ${idx===n?"cur":""}" data-act="tmgo" data-v="${n}" aria-label="Summary">✓</button></div>`;
  let body;
  if(idx<n){const x=driveItems()[idx];
    body=`<div class="row"><span class="muted">Item ${idx+1} of ${n}</span>${x.crit?tag("Critical: a fail ends the test","stop"):""}</div><div class="tm-q">${esc(x.t)}</div>
     <div class="tm-btns"><button class="tmb pass" data-act="tmans" data-v="pass" aria-pressed="${it[x.id]==="pass"}">PASS<small>key P</small></button><button class="tmb fail" data-act="tmans" data-v="fail" aria-pressed="${it[x.id]==="fail"}">FAIL<small>key F</small></button></div>
     <div class="tm-nav"><button class="btn" data-act="tmgo" data-v="${idx-1}" ${idx?"":"disabled"}>← Back</button><button class="btn" data-act="tmgo" data-v="${idx+1}">${it[x.id]?"Next":"Skip"} →</button></div>`}
  else{const res=dr.result,left=n-dr.done;
    body=`<div class="tm-q">${left?`${left} item${left>1?"s":""} still to score`:res==="pass"?"Result: PASS":"Result: FAIL"}</div>
     <div class="kpis"><div class="kpi"><b>${dr.pct??0}%</b><span>Score · pass mark ${s.drivePass}%</span></div><div class="kpi"><b>${dr.critFail.length}</b><span>Critical items failed</span></div></div>
     <label class="f" style="margin-top:16px">Tester notes<textarea data-act="drnotes" data-id="${a.id}" rows="3">${esc(a.drive?.notes||"")}</textarea></label>
     <button class="btn primary" data-act="drsubmit" data-id="${a.id}" ${res?"":"disabled"} style="margin-top:16px;min-height:58px;font-size:18px;width:100%">Submit driving test</button>`}
  return `<div class="tm"><header><div><b>${esc(a.name)}</b><div class="small" style="opacity:.75">Driving test · ${esc(me())}</div></div><button class="btn" data-act="tmexit">Exit test mode</button></header><div class="tm-body">${body}${dots}</div></div>`;
}

function letterHTML(a){const s=settings(),of=a.offer||{};
  return `<p>${fmtD(new Date().toISOString())}</p><p><b>${esc(a.name)}</b><br>${esc(a.phone||"")}${a.email?"<br>"+esc(a.email):""}</p>

function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];

  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.some(x=>x!==""))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x!==""))rows.push(r);return rows}
function refCol(head,rows){const h=head.map(x=>x.toLowerCase().trim());
  // "Question N" / "Response N" pair whose question is the Referral Code
  for(let i=0;i<h.length;i++){const m=h[i].match(/^question (\d+)$/);if(!m)continue;const ri=h.indexOf("response "+m[1]);if(ri<0)continue;

function phoneCol(head,rows){const h=head.map(x=>x.toLowerCase().trim());

  for(let i=0;i<h.length;i++){const m=h[i].match(/^question (\d+)$/);if(!m)continue;const ri=h.indexOf("response "+m[1]);if(ri<0)continue;
    if(rows.some(r=>/phone|mobile|cell|numero|number|contact/i.test(r[i]||"")))return ri}
  const t=h.indexOf("text reminder number");if(t>=0&&rows.some(r=>(r[t]||"").trim()))return t;

  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]\.?m\.?)?$/i);
  if(!m){m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]\.?m\.?)?$/i);if(m)m=[m[0],m[3],m[1],m[2],m[4],m[5],m[6]]}
  if(m){let h=+m[4];const ap=(m[6]||"").toLowerCase()[0];if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0;
    const d=new Date(+m[1],+m[2]-1,+m[3],h,+m[5]);return isNaN(d)?"":d.toISOString()}

document.addEventListener("change",async e=>{
  const t=e.target,A=t.dataset&&t.dataset.act;if(!A)return;const id=t.dataset.id;UI.typing=false;

   case"dayf":UI.dayFilter=t.value;return render();

   case"docb":return updateApplicant(id,a=>{a.docs=a.docs||{};const d=a.docs[t.dataset.k]=a.docs[t.dataset.k]||{};d[t.dataset.f]=t.checked;if(d.status==="verified")delete d.status});
   case"setref":{const v=t.value.trim();if(!v)return;return updateApplicant(id,a=>{a.refCode=v},"Referral code set to "+v)}
   case"setphone":{const v=t.value.trim();if(!v)return;return updateApplicant(id,a=>{a.phone=v},"Mobile number added")}
   case"ocomment":return updateApplicant(id,a=>{a.orientation=a.orientation||{};a.orientation.comment=t.value});
   case"ivnotes":return updateApplicant(id,a=>{a.interview=a.interview||{};a.interview.notes=t.value});
   case"drnotes":return updateApplicant(id,a=>{a.drive=a.drive||{};a.drive.notes=t.value});
   case"ojtf":return updateApplicant(id,a=>{a.ojt=a.ojt||{days:[]};const i=+t.dataset.i;a.ojt.days[i]=Object.assign(a.ojt.days[i]||{},{[t.dataset.f]:t.value})});
   case"offf":return updateApplicant(id,a=>{a.offer=a.offer||{status:"draft"};a.offer[t.dataset.f]=t.value});
   case"csv":{const f=t.files[0];if(!f)return;const txt=(await f.text()).replace(/^\ufeff/,"");const rows=parseCSV(txt);if(rows.length<2)return toast("That file has no rows.");

   case"photo":{const f=t.files[0];if(!f)return;try{await savePhoto(id,t.dataset.k,await shrinkImage(f))}catch(err){console.error(err);toast("Couldn't save that photo. Try a smaller image.")}return}
   case"restore":{const f=t.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(err){return toast("That file isn't a valid backup.")}
     if(d.app!=="mober-das"||!d.applicants)return toast("That file isn't a Mober backup.");

function qrSvg(text,cell){if(!window.qrcode)return `<div class="small muted" style="padding:20px;text-align:center">QR unavailable offline. Code: ${esc(text)}</div>`;const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:cell||4,margin:2,scalable:true})}

function campSlots(c,day){const d=new Date(day+"T00:00");if(!c.days.includes(d.getDay()))return[];
  const now=Date.now(),[sh,sm]=c.start.split(":").map(Number),[eh,em]=c.end.split(":").map(Number),out=[];
  for(let m=sh*60+sm;m+c.len<=eh*60+em;m+=c.len){if((c.offTimes||[]).includes(hhmm(m)))continue;const t=new Date(d);t.setHours(0,m,0,0);if(t.getTime()<now+60*60000)continue;
    const iso=t.toISOString(),taken=!S.uid?(PUB_TAKEN[c.id+"|"+iso]||0):Object.values(S.applicants).filter(a=>a.slot===iso&&a.campaignId===c.id&&!a.calendlyCanceled&&a.booking?.status!=="declined").length;
    out.push({iso,label:t.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}),left:c.seats-taken})}
  return out}
function dayOpen(c,day){const d=new Date(day+"T00:00"),lo=new Date();lo.setHours(0,0,0,0);const hi=new Date(lo);hi.setDate(hi.getDate()+c.window);
  if(d<lo||d>hi||(c.endDate&&day>c.endDate))return false;return campSlots(c,day).some(s=>s.left>0)}

const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function allTimes(c){const [sh,sm]=c.start.split(":").map(Number),[eh,em]=c.end.split(":").map(Number),o=[];for(let m=sh*60+sm;m+c.len<=eh*60+em;m+=c.len)o.push(hhmm(m));return o}

function ageOf(b){if(!b)return null;const d=new Date(b+"T00:00"),n=new Date();let y=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;return y}

function parseGeo(s){const m=String(s||"").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);return m?{lat:+m[1],lng:+m[2]}:null}
async function geocode(q){try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ph&q="+encodeURIComponent(q),{headers:{"Accept":"application/json"}});const j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}}
function travel(hub,geo,mode){if(!hub||!geo)return null;const R=6371,toR=x=>x*Math.PI/180,dLa=toR(geo.lat-hub.lat),dLo=toR(geo.lng-hub.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(toR(hub.lat))*Math.cos(toR(geo.lat))*Math.sin(dLo/2)**2,km=2*R*Math.asin(Math.sqrt(a))*1.35;
  return{km:Math.round(km*10)/10,mins:Math.max(5,Math.round(km/(MODES[mode]||18)*60))}}
const fmtMins=m=>m==null?"—":m<60?m+" min":Math.floor(m/60)+" h "+(m%60?m%60+" min":"");

async function startCam(){
  try{SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}catch(e){return toast("Camera not available. Type the code instead.")}
  UI.camOn=true;SC.last="";if("BarcodeDetector" in window){try{SC.det=new BarcodeDetector({formats:["qr_code"]})}catch(e){SC.det=null}}
  if(!SC.det&&!window.jsQR)await loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js").catch(()=>{});
  render();tick()}
